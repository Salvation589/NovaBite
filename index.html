<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novabite menu</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

  <!-- navbar -->

  <nav class="bg-white shadow-md">
      <div class="container mx-auto px-3 py-3 rounded-lg flex justify-between items-center">
          <a href="#" class="text-xl font-bold text-gray-800">Novabite</a>
          <ul class="flex space-x-4">
              <li><a href="#" class="text-gray-800 px-12 hover:text-gray-800">Home</a></li>
              <li><a href="#" class="text-orange-500 px-12 hover:text-gray-800">Menu</a></li>
              <li><a href="#" class="text-gray-800 px-12 hover:text-gray-800">About</a></li>
              <li><a href="#" class="text-gray-800 px-12 hover:text-gray-800">Blog</a></li>
              <li><a href="#" class="text-gray-800 px-12 hover:text-gray-800">Gallery</a></li>
              <li><a href="#" class="text-gray-800 px-12 hover:text-gray-800">Reservations</a></li>
              <li><a href="#" class="text-gray-800 px-12  hover:text-gray-800">Contact</a></li>
          </ul>
          <button class="bg-orange-600 text-white px-6 py-2 rounded-lg hover:bg-orange-60">Book Table</button>
        </div>
    </nav>
       <section class="relative h-80">
        <img src="https://www.shutterstock.com/image-photo/assorted-thai-food-set-famous-260nw-2464138955.jpg" class="w-full h-full rounded-lg object-cover">
       
       <div class="absolute inset-0 bg-black/60 flex flex-col justify-center items-center text-white">
        <h1 class="text-6xl font-bold px-15">Our Menu</h1>
        <p class="text-xl mt-3">Discover a variety of delicious meals prepared with the finest ingredients.</p>
       </div>
       </section>

       <!-- Category  -->
        <section class="py-8">
        <div class="flex justify-center gap-6">
            <button class="bg-orange-800 text-white px-6 py-3 rounded-lg ">All</button>
            <button class="border px-6 py-3 rounded-lg hover:bg-orange-800 hover:text-white">Breakfast</button>
            <button class="border px-6 py-3 rounded-lg hover:bg-orange-800 hover:text-white">Lunch</button>
            <button class="border px-6 py-3 rounded-lg hover:bg-orange-800 hover:text-white">Dinner</button>
            <button class="border px-6 py-3 rounded-lg hover:bg-orange-800 hover:text-white">Drinks</button>
        </div>
        </section>
        <section class="max-w-7xl mx-auto px-6 mb-12">
            <h2 class="text-4xl font-bold mb-8">Breakfast</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <div class="bg-white rounded-xl shadow">
                    <img src="https://i.pinimg.com/736x/94/d8/9f/94d89fb151fa9404ea170121dbdd265d.jpg" class="w-full h-52 object-cover rounded-t-xl">
                    <div class="p-4">
                        <h3 class="font-bold text-xl">Pancakes</h3>
                        <p class="text-orange-500 font-bold">$5.99</p>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow">
                    <img src="https://i.pinimg.com/1200x/9a/44/d7/9a44d79fb888845c02267f00477daaf2.jpg" class="w-full h-52 object-cover rounded-t-xl">
                    <div class="p-4">
                        <h3 class="font-bold text-xl">Omelette</h3>
                        <p class="text-orange-500 font-bold">$4.99</p>
                    </div>
                </div>
                  
                <div class="bg-white rounded-xl shadow">
                    <img src="https://i.pinimg.com/736x/34/e2/72/34e27243e857d0a176c2de90872dbad8.jpg" class="w-full h-52 object-cover rounded-t-xl">
                    <div class="p-4">
                      <h3 class="font-bold text-xl">Avocado Toast</h3>
                      <p class="text-orange-500 font-bold">$6.99</p>
                    </div>
                </div>
                  <div class="bg-white rounded-xl shadow">
                    <img src="https://i.pinimg.com/1200x/11/41/4f/11414f17dc595fb8f059de4f68291669.jpg" class="w-full h-52 object-cover rounded-t-xl">
                    <div class="p-4">
                        <h3 class="font-bold text-xl">Breakfast Platter</h3>
                        <p class="text-orange-500 font-bold">$9.99</p>
                    </div>
                  </div>

            </div>
        </section>
    
    
    
</body>
</html>
